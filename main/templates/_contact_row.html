<tr id="contact-{{ contact.id }}">
  <td>{{ contact.name }}</td>
  <td>{{ contact.email }}</td>
  <td>
    <button hx-delete="{% url 'main:contact_delete' contact.id %}"
            hx-target="closest tr"
            hx-swap="outerHTML"
            hx-confirm="Yakin hapus {{ contact.name }}?">
      Hapus
    </button>
    <button hx-get="{% url 'main:contact_edit' contact.id %}"
        hx-target="closest tr"
        hx-swap="outerHTML">
            Edit
    </button>
  </td>
  </td>
  <tr id="contact-{{ contact.id }}">
  <td><input type="text" name="name" value="{{ contact.name }}" required form="edit-form-{{ contact.id }}"></td>
  <td><input type="email" name="email" value="{{ contact.email }}" required form="edit-form-{{ contact.id }}"></td>
  <td>
    <form id="edit-form-{{ contact.id }}"
          hx-put="{% url 'main:contact_update' contact.id %}"
          hx-target="#contact-{{ contact.id }}"
          hx-swap="outerHTML">
      <button type="submit">Simpan</button>
    </form>
    <button hx-get="{% url 'main:contact_row' contact.id %}"
            hx-target="#contact-{{ contact.id }}"
            hx-swap="outerHTML">
      Batal
    </button>
  </td>
</tr>
</tr>
